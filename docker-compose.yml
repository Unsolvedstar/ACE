services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acme_hr
      POSTGRES_USER: acme_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_app -d acme_hr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: src/AcmeHR.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=acme_hr;Username=acme_app;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env (see .env.example)}"
      Seed__BootstrapPassword: "${SEED_BOOTSTRAP_PASSWORD:-}"
      Jwt__Issuer: AcmeHR
      Jwt__Audience: AcmeHR.Client
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5167:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
