# Render Blueprint — deploys the whole stack (API, frontend, database) from this repo.
#
# To use: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file and
# provisions all three resources below in one go. See README.md "Deploying to
# Render" for the full walkthrough and post-deploy checklist.
#
# This targets the free tier for a testing/demo deployment, not production:
# - The free Postgres database is deleted after its trial period (Render's
#   current policy — check the dashboard when creating it). Fine for testing;
#   upgrade the `plan` below (or point ConnectionStrings__Default at an
#   external provider like Neon/Supabase) before relying on it long-term.
# - Free web services spin down after 15 minutes of inactivity; the next
#   request wakes them up with a ~30-60s cold start.

databases:
  - name: acme-hr-db
    plan: free
    databaseName: acme_hr
    user: acme_app

services:
  - type: web
    name: acme-hr-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/src/AcmeHR.Api/Dockerfile
    dockerContext: ./server
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        fromDatabase:
          name: acme-hr-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      # Password for the bootstrap HR/Executive accounts created on first deploy. Set it in the
      # Render dashboard (Environment tab) - never commit it. Without it, no accounts are seeded.
      - key: Seed__BootstrapPassword
        sync: false
      - key: Jwt__Issuer
        value: AcmeHR
      - key: Jwt__Audience
        value: AcmeHR.Client
      - key: Jwt__ExpiryMinutes
        value: "60"
      # Must match the client service's public URL exactly (scheme + host, no
      # trailing slash). Render normally derives it from the `name` below, but
      # confirm the actual URL after first deploy and update this if it differs.
      - key: Cors__AllowedOrigins__0
        value: https://acme-hr-client.onrender.com
      # Attachments (PPE certs, medical docs, policy PDFs, ...) are stored in a
      # Cloudflare R2 bucket instead of the container's own disk, which is wiped on
      # every redeploy/restart. Create the bucket + an R2 API token in the Cloudflare
      # dashboard, then fill in the three secret values below in the Render dashboard
      # (Environment tab) — they're marked `sync: false` so they're never committed here.
      - key: Storage__Provider
        value: S3
      - key: Storage__S3ServiceUrl
        sync: false
      - key: Storage__S3BucketName
        sync: false
      - key: Storage__S3AccessKeyId
        sync: false
      - key: Storage__S3SecretAccessKey
        sync: false

  - type: web
    name: acme-hr-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Must match the api service's public URL exactly, with /api appended.
      # Baked into the JS bundle at build time — changing it requires a rebuild.
      - key: VITE_API_BASE_URL
        value: https://acme-hr-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
